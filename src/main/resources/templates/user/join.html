<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
</head>
<body>
<h2>회원가입</h2>

<!-- 에러 메시지 -->
<div th:if="${error}" style="color:red;">
  <p th:text="${error}"></p>
</div>

<form th:action="@{/user/join}" method="post">

  <label>이메일:</label>
  <input type="email" name="userEmail" th:value="${email}" readonly style="background-color: #f0f0f0;" /><br/><br/>

  <label>비밀번호:</label>
  <input type="password" name="userPassword" required /><br/><br/>

  <label>이름:</label>
  <input type="text" name="userName" required /><br/><br/>

  <button type="submit">가입하기</button>
</form>
</body>
</html>
