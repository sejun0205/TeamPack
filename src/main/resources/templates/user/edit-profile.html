<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원정보 수정</title>
</head>
<body>
<h2>회원정보 수정</h2>

<form th:action="@{/user/update}" method="post">
  <label>이메일 (수정 불가):</label>
  <input type="email" name="userEmail" th:value="${user.userEmail}" readonly /><br/><br/>


  <label>이름:</label>
  <input type="text" name="userName" th:value="${user.userName}" required /><br/><br/>



  <label>전화번호:</label>
  <input
          type="tel"
          name="userPhone"
          th:value="${user.userPhone}"
          required
          pattern="^01[0-9]-\d{3,4}-\d{4}$"
          placeholder="010-1234-5678"
          title="010-1234-5678 형식으로 입력해주세요."
  /><br/><br/>

  <button type="submit">수정하기</button>
</form>

<a th:href="@{/user/mypage}">← 마이페이지로 돌아가기</a>
</body>
</html>
