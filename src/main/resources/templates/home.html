<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>홈</title>
</head>
<body>
<h2>홈 화면</h2>

<!-- 로그인 한 사용자 -->
<div th:if="${loginUser != null}">
  <p th:text="'안녕하세요, ' + ${loginUser.userName} + '님!'"></p>
  <a th:href="@{/user/logout}">로그아웃</a>
  <a th:href="@{/team/create}">팀 만들기</a>
  <a th:href="@{/team/my}">내 팀 보기</a>
  <a th:href="@{/user/mypage}">마이페이지</a>
</div>



<!-- 로그인 안 한 사용자 -->
<div th:if="${loginUser == null}">
  <p>로그인되지 않았습니다.</p>
  <a th:href="@{/user/login}">로그인</a>
  <a th:href="@{/user/email}">회원가입</a>
</div>

</body>
</html>
