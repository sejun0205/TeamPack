<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>내 팀 목록</title>
</head>
<body>
<h2>내 팀 목록</h2>

<!-- 참여한 팀이 없을 경우 -->
<div th:if="${teams.isEmpty()}">
  <p>참여 중인 팀이 없습니다.</p>
</div>

<!-- 참여한 팀 목록 -->
<ul th:if="${!teams.isEmpty()}">
  <li th:each="team : ${teams}">
    <p>
      <!-- 팀 제목을 상세페이지 링크로 감싸기 -->
      <strong>
        <a th:href="@{/team/detail/{id}(id=${team.teamId})}"
           th:text="${team.teamName}"></a>
      </strong>
      <br/>

      과제: <span th:text="${team.assignmentTitle}"></span><br/>
      마감일:
      <span th:text="${#temporals.format(team.dueDate, 'yyyy년 MM월 dd일 HH시 mm분')}"></span><br/>

      <!-- 팀장만 초대 링크 표시 -->
      <a th:if="${team.memberType == 'LEADER'}"
         th:href="@{/team/invite-form(teamId=${team.teamId})}">
        팀원 초대
      </a>
    </p>
  </li>
</ul>

<a th:href="@{/}">홈으로</a>
</body>
</html>
