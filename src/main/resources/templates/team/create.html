<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 생성</title>
</head>
<body>
<h2>팀 생성</h2>

<form th:action="@{/team/create}" method="post" th:object="${teamDto}">
    <label>팀 이름:</label>
    <input type="text" th:field="*{teamName}" required /><br/><br/>

    <label>과제 제목:</label>
    <input type="text" th:field="*{assignmentTitle}" required /><br/><br/>

    <label>마감일:</label>
    <input type="datetime-local" th:field="*{dueDate}" required /><br/><br/>

    <label>내 역할 (예: 백엔드, 기획 등):</label>
    <input type="text" name="myRole" required /><br/><br/>

    <button type="submit">생성하기</button>
</form>
</body>
</html>
