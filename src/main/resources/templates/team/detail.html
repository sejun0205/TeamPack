<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>팀 상세 정보</title>
</head>
<body>

<h2>팀 상세 정보</h2>

<div>
  <p><strong>팀 이름:</strong> <span th:text="${team.teamName}"></span></p>
  <p><strong>과제 제목:</strong> <span th:text="${team.assignmentTitle}"></span></p>
  <p><strong>마감일:</strong> <span th:text="${#temporals.format(team.dueDate, 'yyyy년 MM월 dd일 HH시 mm분')}"></span></p>
</div>

<hr/>

<h3>팀원 목록</h3>
<ul>
  <li th:each="member : ${members}">
    <span th:text="${member.userName}"></span>
    (<span th:text="${member.memberType}"></span> / <span th:text="${member.memberRole}"></span>)

    <!-- 팀장만 보이는 '내보내기' 버튼 -->
    <form th:if="${team.memberType == 'LEADER'}"
          th:action="@{/team/kick}"
          method="post"
          style="display:inline;">
      <input type="hidden" name="teamId" th:value="${team.teamId}" />
      <input type="hidden" name="targetUserId" th:value="${member.userId}" />
      <button type="submit"
              th:if="${member.memberType != 'LEADER'}">내보내기</button>
    </form>
  </li>
</ul>

<hr/>

<!-- 팀 리더만 초대 폼 보이게 -->
<div th:if="${team.memberType == 'LEADER'}">
  <h3>팀원 초대하기</h3>
  <form th:action="@{/team/invite}" method="post">
    <input type="hidden" name="teamId" th:value="${team.teamId}" />

    <label for="email">이메일:</label>
    <input type="email" id="email" name="email" required /><br/><br/>

    <label for="role">역할:</label>
    <input type="text" id="role" name="role" placeholder="ex. 기획, 프론트엔드" required /><br/><br/>

    <button type="submit">초대 보내기</button>
  </form>
</div>

<hr/>

<a th:href="@{/team/my}">내 팀 목록으로 돌아가기</a>

</body>
</html>
